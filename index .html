<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot || Realtime chat with modals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .shell {
      width: 640px;
      height: 90vh;
      background: #13131f;
      border-radius: 20px;
      border: 0.5px solid #2a2a3d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(83, 74, 183, 0.15);
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 0.5px solid #2a2a3d;
      background: #1a1a2e;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: #2d2560;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid #534AB7;
    }
    .avatar svg { width: 18px; height: 18px; }
    .header-title { font-size: 15px; font-weight: 600; color: #e0deff; }
    .header-sub { font-size: 12px; color: #7c7ca0; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #1D9E75;
      display: inline-block;
      box-shadow: 0 0 6px #1D9E75;
    }
    .dot.offline {
      background: #C0504D;
      box-shadow: 0 0 6px #C0504D;
    }
    .dot.checking {
      background: #7c7ca0;
      box-shadow: none;
    }

    .reset-btn {
      font-size: 12px; font-weight: 500;
      background: transparent;
      border: 0.5px solid #3a3a5c;
      color: #7c7ca0;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reset-btn:hover { border-color: #534AB7; color: #c0b8ff; background: #1e1b3a; }
    /* Nothing to save yet, said by the button rather than by its absence —
       a control that appears once the first answer lands moves the one
       beside it, and "Clear chat" is not a button anyone should press by
       having it slide under the cursor. */
    .reset-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .reset-btn:disabled:hover { border-color: #3a3a5c; color: #7c7ca0; background: transparent; }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    /* MESSAGES */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a3d transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #2a2a3d; border-radius: 4px; }

    .msg-row { display: flex; gap: 10px; align-items: flex-end; }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .msg-icon.bot { background: #2d2560; border: 1px solid #534AB7; }
    .msg-icon.user { background: #0f3d2e; border: 1px solid #1D9E75; }

    .bubble {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
    }
    .bubble.bot {
      background: #1e1e32;
      color: #d0cfee;
      border: 0.5px solid #2a2a3d;
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: #2d2560;
      color: #e0deff;
      border: 0.5px solid #534AB7;
      border-bottom-right-radius: 4px;
    }
    .bubble.error {
      background: #2d1515;
      color: #f09595;
      border: 0.5px solid #5a2020;
    }
    .time { font-size: 11px; color: #4a4a6a; margin-top: 4px; }
    .time.right { text-align: right; }

    /* Sits in the timestamp line rather than over the bubble: an answer is
       read far more often than it is copied, and a button hovering on the
       text would be in the way of the reading. */
    .copy-btn {
      margin-left: 8px;
      padding: 0;
      border: 0;
      background: none;
      color: #4a4a6a;
      font: inherit;
      cursor: pointer;
    }
    .copy-btn:hover, .copy-btn:focus-visible { color: #c0b8ff; }
    .copy-btn.copied { color: #5DCAA5; }

    /* TYPING */
    .typing-indicator { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
    .typing-indicator span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #534AB7;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* CHIPS */
    /* Floats over the foot of the transcript rather than sitting in the
       layout: it comes and goes as the reader scrolls, and a button that
       took up a row would push the conversation about every time it did. */
    .jump-latest {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 0.5px solid #3a3a5c;
      background: #1e1b3a;
      color: #c0b8ff;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: background 0.2s, border-color 0.2s;
      z-index: 2;
    }
    .jump-latest:hover { background: #2a2557; border-color: #534AB7; }
    .jump-latest[hidden] { display: none; }
    /* The anchor the pill is positioned against. */
    .messages-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .suggestions {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 4px 20px 12px;
    }
    .chip {
      font-size: 12px;
      padding: 6px 13px;
      border-radius: 20px;
      border: 0.5px solid #3a3a5c;
      background: #1a1a2e;
      color: #9090c0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { border-color: #534AB7; color: #c0b8ff; background: #1e1b3a; }

    /* INPUT */
    .input-area {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px;
      border-top: 0.5px solid #2a2a3d;
      background: #1a1a2e;
    }
    .input-wrap {
      flex: 1;
      display: flex; align-items: center;
      background: #13131f;
      border: 0.5px solid #3a3a5c;
      border-radius: 24px;
      padding: 0 16px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #534AB7; }
    .input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      color: #e0deff;
      padding: 11px 0;
      outline: none;
      font-family: 'Segoe UI', sans-serif;
    }
    .input-wrap input::placeholder { color: #4a4a6a; }

    /* Only there near the limit. Most messages are a line long, and a
       running count under every one of them would be noise about a limit
       almost nobody comes close to. */
    .char-count {
      flex-shrink: 0;
      margin-left: 10px;
      font-size: 11px;
      color: #7c7ca0;
      white-space: nowrap;
    }
    .char-count.full { color: #f09595; }
    .char-count[hidden] { display: none; }

    .send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: #534AB7;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:hover { background: #3C3489; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; }
    .send-btn[hidden] { display: none; }

    /* Stop is the same shape in a colour that reads as "interrupt" rather
       than "go" — it stands where send was, because that is where the hand
       already is. */
    .stop-btn { background: #8A3A4E; }
    .stop-btn:hover { background: #6E2E3E; }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #3a3a5a;
      padding: 6px 0 10px;
      background: #1a1a2e;
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.3"/>
          <path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="header-title">Gemini Assistant</div>
        <div class="header-sub">
          <span class="dot checking" id="status-dot"></span>
          <span id="status-text">Checking backend…</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <!-- Before the clear, in reading order and in importance: this is the
           way out of the one action on this page that cannot be undone. -->
      <button class="reset-btn" id="save-btn" onclick="saveChat()" disabled
              title="Download this conversation as a text file">Save chat</button>
      <button class="reset-btn" onclick="resetChat()">Clear chat</button>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages-wrap">
  <div class="messages" id="chat-box">
    <div class="msg-row">
      <div class="msg-icon bot">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/>
          <path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="bubble bot">Hi! I'm your Gemini assistant. Ask me anything — I'm here to help.</div>
        <div class="time" id="init-time"></div>
      </div>
    </div>
  </div>

    <button class="jump-latest" id="jump-btn" onclick="scrollToLatest()" hidden>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Latest
    </button>
  </div>

  <!-- SUGGESTION CHIPS -->
  <div class="suggestions" id="suggestions">
    <span class="chip" onclick="useChip(this)">What can you do?</span>
    <span class="chip" onclick="useChip(this)">Tell me a fun fact</span>
    <span class="chip" onclick="useChip(this)">Help me write something</span>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-wrap">
      <!-- Matches MAX_MESSAGE_CHARS on the server. The server is still the
           one enforcing it — this only means the limit is met while typing
           rather than after pressing send. -->
      <input id="user-input" type="text" maxlength="8000" placeholder="Type your message... (↑ for earlier ones)" />
      <span class="char-count" id="char-count" aria-live="polite" hidden></span>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="send-btn stop-btn" id="stop-btn" onclick="stopAnswer()" aria-label="Stop generating" hidden>
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="7" y="7" width="10" height="10" rx="2" fill="white"/>
      </svg>
    </button>
  </div>

  <div class="footer-note">Powered by Gemini · Responses may be inaccurate</div>
</div>

<script>
  const chatBox = document.getElementById('chat-box');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const stopBtn = document.getElementById('stop-btn');
  const jumpBtn = document.getElementById('jump-btn');

  // Staying at the foot of the transcript, but only for somebody who was
  // already there.
  //
  // Every new line used to drag the view to the bottom, and a six-stage PLM
  // analysis streams for long enough that reading it as it arrives is the
  // normal thing to do. Scrolling back to stage two meant being thrown to the
  // end again a quarter of a second later, every quarter of a second, until
  // the answer finished.
  //
  // A little short of the true bottom counts as the bottom: a reader a line
  // or two up is still following along, and demanding an exact match would
  // drop the anchor on a rounding error.
  const STICK_WITHIN_PX = 64;

  function atBottom() {
    return chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight <= STICK_WITHIN_PX;
  }

  function scrollToLatest() {
    chatBox.scrollTop = chatBox.scrollHeight;
    jumpBtn.hidden = true;
  }

  // Called after something has been added, with whether the view was at the
  // foot before it was. Somebody who has scrolled away is not moved; they are
  // told there is more, and given the way back.
  function followTail(wasAtBottom) {
    if (wasAtBottom) scrollToLatest();
    else jumpBtn.hidden = false;
  }

  // Scrolling back down by hand answers the pill's question, so it goes.
  chatBox.addEventListener('scroll', () => {
    if (atBottom()) jumpBtn.hidden = true;
  });

  // Held while an answer is streaming so it can be called off. A six-stage
  // PLM analysis runs for a while, and by paragraph two it is often already
  // clear the question was the wrong one.
  let inFlight = null;

  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  // The conversation this tab belongs to. The backend keeps one thread per
  // session, so without an id of our own every tab would be talking into the
  // same one — and clearing the chat in either would clear it in both.
  //
  // Storage can be unavailable (private windows, blocked site data). A
  // session that only lives for this page load is a worse conversation than
  // one that survives a reload, but it is still a conversation of its own.
  const SESSION_KEY = 'plm-chat.session-id';

  function newSessionId() {
    return (crypto.randomUUID?.() || String(Date.now()) + Math.random().toString(36).slice(2))
      .replace(/-/g, '');
  }

  let sessionId = (() => {
    try {
      const saved = localStorage.getItem(SESSION_KEY);
      if (saved) return saved;

      const fresh = newSessionId();
      localStorage.setItem(SESSION_KEY, fresh);
      return fresh;
    } catch (e) {
      return newSessionId();
    }
  })();

  document.getElementById('init-time').textContent = now();

  // The server already remembers this conversation - the session id above
  // survives a reload, and so does the history the model is given. The page
  // did not: a refresh, or reopening the tab, showed a blank chat while the
  // assistant carried on answering with everything above it still in mind.
  // The next reply would refer back to "the second option" and there was
  // nothing on screen to say what that had been.
  //
  // Only what was said is kept. Error bubbles describe a moment that has
  // passed, and replaying "Could not reach the backend" on the next visit
  // would report a problem that may not exist any more.
  const TRANSCRIPT_KEY = 'plm-chat-transcript';
  // Well past the server's rolling window, so the screen never forgets
  // something the model still remembers, and short enough to stay light.
  const MAX_SAVED_MESSAGES = 60;

  function loadTranscript() {
    try {
      const saved = JSON.parse(localStorage.getItem(TRANSCRIPT_KEY));

      // Tied to the session it came from. A transcript from another session
      // is a conversation the server knows nothing about, and showing it
      // would make the assistant look as though it had forgotten.
      if (!saved || saved.sessionId !== sessionId || !Array.isArray(saved.messages)) return [];

      return saved.messages.filter(
        (m) => m && (m.type === 'user' || m.type === 'bot') && typeof m.text === 'string'
      );
    } catch (e) {
      return [];
    }
  }

  let transcript = loadTranscript();

  function saveMessage(type, text) {
    transcript = [...transcript, { type, text, time: now() }].slice(-MAX_SAVED_MESSAGES);

    try {
      localStorage.setItem(TRANSCRIPT_KEY, JSON.stringify({ sessionId, messages: transcript }));
    } catch (e) { /* storage unavailable - the chat still works, it just forgets */ }

    renderSaveState();
  }

  function clearTranscript() {
    transcript = [];

    try {
      localStorage.removeItem(TRANSCRIPT_KEY);
    } catch (e) { /* nothing stored to clear */ }

    renderSaveState();
  }

  // Taking the conversation with you.
  //
  // "Clear chat" wipes the screen, the stored transcript and the server's
  // thread, and until now that was the only way to start a new subject — so
  // the price of the next question was everything answered before it. An
  // hour of working something out deserves to survive the press that ends
  // it.
  //
  // Plain text rather than JSON: this is written to be read again, pasted
  // into a document, or sent to somebody. Nothing here needs parsing back.
  //
  // Only what was actually said, because that is all the transcript keeps —
  // error bubbles describe a moment that has already passed.
  const saveBtn = document.getElementById('save-btn');

  function renderSaveState() {
    saveBtn.disabled = transcript.length === 0;
    saveBtn.title = saveBtn.disabled
      ? 'Nothing to save yet'
      : `Download this conversation (${transcript.length} messages) as a text file`;
  }

  function transcriptText() {
    const header = `Gemini Assistant — conversation of ${new Date().toLocaleString()}`;

    const body = transcript.map(
      (message) => `[${message.time}] ${message.type === 'user' ? 'You' : 'Assistant'}:\n${message.text}`
    );

    return [header, '', ...body].join('\n\n');
  }

  function saveChat() {
    if (transcript.length === 0) return;

    // Dated rather than numbered: two saves in one session are almost always
    // the same conversation at two points, and the later one should not be
    // guessed at from "chat (3)".
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    const blob = new Blob([transcriptText()], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download = `gemini-chat-${stamp}.txt`;
    document.body.appendChild(link);
    link.click();
    link.remove();

    // The download has already been handed to the browser by the time this
    // runs; holding the object URL open any longer only leaks it.
    URL.revokeObjectURL(url);
  }

  // Ping the backend so the header reflects the real connection state.
  //
  // It used to ask once, on load, and then believe the answer for as long as
  // the tab stayed open. Open the page before starting Flask — the usual
  // order when working on it — and the header said "Backend offline" over a
  // conversation that was going perfectly well; stop the server mid-session
  // and it went on saying "Online" to every failed send.
  //
  // So while it is offline it keeps asking, every few seconds, and stops as
  // soon as it hears back. While it is online nothing polls: every message
  // sent is already a check, and its outcome is reported below.
  const RECHECK_OFFLINE_MS = 5000;
  let recheckTimer = null;

  function showOnline(model) {
    clearTimeout(recheckTimer);
    recheckTimer = null;
    statusDot.className = 'dot';
    statusText.textContent = `Online · ${model || 'ready'}`;
  }

  function showOffline() {
    statusDot.className = 'dot offline';
    statusText.textContent = 'Backend offline · retrying';

    if (!recheckTimer) {
      recheckTimer = setTimeout(() => {
        recheckTimer = null;
        checkBackend();
      }, RECHECK_OFFLINE_MS);
    }
  }

  async function checkBackend() {
    try {
      const res = await fetch('http://localhost:5000/health');
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      showOnline(data.model);
    } catch (e) {
      showOffline();
    }
  }

  checkBackend();

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Offers the failed question back. A message that did not get through is
  // the one most likely to be wanted again immediately — the backend was
  // restarting, the connection dropped, the model returned nothing — and
  // until now the only way back to it was to retype the whole thing, or to
  // walk the arrow-key history past it.
  //
  // It puts the text in the box rather than sending it. What failed may have
  // failed because of the question, and a retry that fires on sight gives
  // nobody the chance to change a word of it first.
  function retryButton(text) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'copy-btn';
    button.textContent = 'Try again';
    button.setAttribute('aria-label', 'Put that message back in the box');

    button.addEventListener('click', () => {
      input.value = text;
      renderCharCount();
      input.focus();
      input.setSelectionRange(text.length, text.length);
    });

    return button;
  }

  function appendMsg(text, type, time = now(), retryText = '') {
    const isUser = type === 'user';
    const row = document.createElement('div');
    row.className = 'msg-row' + (isUser ? ' user' : '');

    const botIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/><path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/></svg>`;
    const userIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#1D9E75" opacity="0.4"/><path d="M12 7a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-5 10c0-2.2 2.2-4 5-4s5 1.8 5 4" stroke="#9FE1CB" stroke-width="2" stroke-linecap="round"/></svg>`;

    const bubbleClass = type === 'error' ? 'bubble error' : (isUser ? 'bubble user' : 'bubble bot');

    row.innerHTML = `
      <div class="msg-icon ${isUser ? 'user' : 'bot'}">${isUser ? userIcon : botIcon}</div>
      <div>
        <div class="${bubbleClass}">${escHtml(text)}</div>
        <div class="time ${isUser ? 'right' : ''}">${time}</div>
      </div>`;

    // Only on a failure that has a question behind it. "Stopped before the
    // answer started" is a choice somebody made, not something to offer back.
    if (retryText) {
      row.querySelector('.time').appendChild(retryButton(retryText));
    }

    const stick = atBottom();

    chatBox.appendChild(row);
    // Sending is itself a statement about where the reader is: nobody presses
    // send and then expects to stay reading something further up.
    followTail(stick || isUser);
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.id = 'typing-row';
    const botIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/><path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/></svg>`;
    row.innerHTML = `
      <div class="msg-icon bot">${botIcon}</div>
      <div class="bubble bot" style="padding:0">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>`;

    const stick = atBottom();

    chatBox.appendChild(row);
    followTail(stick);
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  // A PLM analysis runs to six sections and is usually headed somewhere else
  // - a report, a ticket, an email to the team. Selecting it by hand means
  // dragging across a scrolling bubble and picking up the timestamp with it.
  //
  // Reads the bubble at the moment of the click rather than when the button
  // is made, because the button exists from the first word of a streamed
  // answer and the answer is not finished until the last.
  function copyButton(bubble) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'copy-btn';
    button.textContent = 'Copy';
    button.setAttribute('aria-label', 'Copy this answer');

    button.addEventListener('click', async () => {
      const text = bubble.textContent.trim();
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        button.textContent = 'Copied';
        button.classList.add('copied');
      } catch (e) {
        // Refused clipboard (an insecure origin, a denied permission): select
        // the text instead, so Ctrl+C still gets it in one keystroke.
        const range = document.createRange();
        range.selectNodeContents(bubble);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        button.textContent = 'Selected';
      }

      setTimeout(() => {
        button.textContent = 'Copy';
        button.classList.remove('copied');
      }, 1600);
    });

    return button;
  }

  // An empty bot bubble to write into as the answer arrives. Text goes in
  // through textContent, so a reply containing < or & renders as itself
  // rather than as markup.
  function startBotMsg(time = now()) {
    const row = document.createElement('div');
    row.className = 'msg-row';

    const botIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/><path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/></svg>`;

    row.innerHTML = `
      <div class="msg-icon bot">${botIcon}</div>
      <div>
        <div class="bubble bot"></div>
        <div class="time">${time}</div>
      </div>`;

    const bubble = row.querySelector('.bubble');
    row.querySelector('.time').appendChild(copyButton(bubble));

    const stick = atBottom();

    chatBox.appendChild(row);
    followTail(stick);

    return { row, bubble };
  }

  // Swaps the composer between "send" and "stop". They occupy the same slot,
  // so only one is ever on screen and the button under the cursor is always
  // the one that applies.
  function setBusy(busy) {
    sendBtn.hidden = busy;
    stopBtn.hidden = !busy;
    input.disabled = busy;
  }

  function stopAnswer() {
    if (inFlight) inFlight.abort();
  }

  function useChip(el) {
    input.value = el.textContent;
    document.getElementById('suggestions').style.display = 'none';
    sendMessage();
  }

  // The stream arrives as server-sent events: `data: {...}` frames separated
  // by a blank line. A chunk off the network can split a frame anywhere, so
  // whatever follows the last separator is kept back for the next read.
  async function* readEvents(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      const frames = buffer.split('\n\n');
      buffer = frames.pop();

      for (const frame of frames) {
        const line = frame.split('\n').find((l) => l.startsWith('data:'));
        if (!line) continue;

        try {
          yield JSON.parse(line.slice(5).trim());
        } catch (e) {
          /* a frame we cannot read is not worth ending the answer over */
        }
      }
    }
  }

  async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    document.getElementById('suggestions').style.display = 'none';
    appendMsg(msg, 'user');
    saveMessage('user', msg);
    input.value = '';
    renderCharCount();
    recallIndex = -1;
    setBusy(true);
    showTyping();

    let bubble = null;
    const controller = new AbortController();
    inFlight = controller;

    try {
      const res = await fetch('http://localhost:5000/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, session_id: sessionId }),
        signal: controller.signal
      });

      // Any answer at all, even a refusal, means the server is there.
      if (statusDot.classList.contains('offline')) checkBackend();

      // A refusal before the stream opens still answers in JSON.
      if (!res.ok || !res.body) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || 'The backend refused that message.');
      }

      for await (const event of readEvents(res)) {
        if (event.error) {
          removeTyping();
          appendMsg('Error: ' + event.error, 'error', now(), msg);
          bubble = null;
          break;
        }

        if (event.delta) {
          // The indicator gives way to the answer the moment there is one.
          if (!bubble) {
            removeTyping();
            bubble = startBotMsg().bubble;
          }

          const stick = atBottom();

          bubble.textContent += event.delta;
          followTail(stick);
        }
      }

      removeTyping();

      // A stream that opened and closed without a word is still a failure,
      // and an empty bubble does not say so.
      if (bubble && !bubble.textContent.trim()) {
        bubble.closest('.msg-row').remove();
        appendMsg('The model returned an empty answer. Try rephrasing.', 'error', now(), msg);
      } else if (bubble) {
        saveMessage('bot', bubble.textContent);
      }
    } catch (e) {
      removeTyping();

      // Aborting is a choice, not a fault. Whatever had already arrived stays
      // on screen and is marked as cut short, rather than the partial answer
      // disappearing as if nothing had been said.
      if (e.name === 'AbortError') {
        if (bubble && bubble.textContent.trim()) {
          bubble.textContent += ' …';
          // Kept as it was shown, cut short. The server holds the full
          // answer, but the screen should come back the way it was left.
          saveMessage('bot', bubble.textContent);
          appendMsg('Stopped. The server keeps the full answer in this conversation.', 'error');
        } else {
          if (bubble) bubble.closest('.msg-row').remove();
          appendMsg('Stopped before the answer started.', 'error');
        }
      } else {
        // The header should not go on saying "Online" under a message that
        // has just failed to reach it.
        if (e.name === 'TypeError') showOffline();

        appendMsg(
          e.message === 'Failed to fetch'
            ? 'Could not reach the backend. Is your Flask server running?'
            : e.message,
          'error',
          now(),
          msg
        );
      }
    }

    inFlight = null;
    setBusy(false);
    input.focus();
  }

  async function resetChat() {
    // Clears this conversation on the server too — otherwise the next
    // message would still arrive with everything above it as context.
    try {
      await fetch('http://localhost:5000/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId })
      });
    } catch (e) { /* a cleared screen is still worth something */ }
    clearTranscript();
    chatBox.innerHTML = '';
    const botIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/><path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/></svg>`;
    chatBox.innerHTML = `
      <div class="msg-row">
        <div class="msg-icon bot">${botIcon}</div>
        <div>
          <div class="bubble bot">Chat cleared. Fresh start!</div>
          <div class="time">${now()}</div>
        </div>
      </div>`;
    // Nothing is below the fold any more, whatever the pill was saying about
    // the conversation that has just been cleared.
    scrollToLatest();
    document.getElementById('suggestions').style.display = 'flex';
  }

  renderSaveState();

  // Put the conversation back the way it was left, under the greeting.
  if (transcript.length > 0) {
    document.getElementById('suggestions').style.display = 'none';

    for (const message of transcript) {
      if (message.type === 'user') {
        appendMsg(message.text, 'user', message.time);
      } else {
        startBotMsg(message.time).bubble.textContent = message.text;
      }
    }

    // Each restored bubble is filled after it is placed, so the transcript
    // goes on growing underneath the view as it is rebuilt. A reload opens
    // where the conversation was left, which is the end of it.
    scrollToLatest();
  }

  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });

  // Bringing back something already asked. The commonest second message in
  // this chat is the first one again: a question stopped halfway, a request
  // the backend refused while it was down, the same analysis with one word
  // changed. Each of those meant typing a paragraph out a second time.
  //
  // Up walks back through what was sent, down walks forward again, the way a
  // terminal does. Read from the saved transcript, so the questions survive a
  // reload along with the answers to them.
  //
  // Only from an empty box, or while already walking. Once somebody types,
  // the text in the box is theirs, and an arrow press is not a reason to
  // replace it.
  let recallIndex = -1;

  function sentMessages() {
    const sent = transcript.filter((m) => m.type === 'user').map((m) => m.text);

    // Asking the same thing three times in a row is one entry to step over,
    // not three.
    return sent.filter((text, i) => text !== sent[i - 1]);
  }

  input.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    if (e.isComposing || input.disabled) return;

    const history = sentMessages();
    if (history.length === 0) return;

    if (e.key === 'ArrowUp') {
      if (recallIndex === -1 && input.value !== '') return;
      recallIndex = Math.min(recallIndex + 1, history.length - 1);
    } else {
      if (recallIndex === -1) return;
      recallIndex -= 1;
    }

    e.preventDefault();

    // Walking forward past the newest message lands back on an empty box,
    // which is where the walk started.
    input.value = recallIndex === -1 ? '' : history[history.length - 1 - recallIndex];
    renderCharCount();
    input.setSelectionRange(input.value.length, input.value.length);
  });

  // Editing a recalled message makes it a new one. The walk ends there, so
  // the next arrow press cannot throw the edit away.
  input.addEventListener('input', () => {
    recallIndex = -1;
  });

  // Saying so when a message is about to run into the length limit.
  //
  // The box stops at the server's limit, and it stops silently: paste a
  // long document into it and everything past the limit is dropped with
  // nothing on screen to say so. The question then goes off missing its
  // last pages, and the answer is to something other than what was asked.
  //
  // The count appears in the last stretch before the limit, and a paste that
  // did not fit says outright that the end of it was cut off — that is the
  // case where nobody watching the box would notice.
  const charCount = document.getElementById('char-count');
  const COUNT_FROM = Math.floor(input.maxLength * 0.9);
  let pasteCut = false;

  function renderCharCount() {
    const length = input.value.length;
    const full = length >= input.maxLength;

    // A cut paste stays flagged only until the box stops being full; once
    // something has been taken out, the text in it is a new message.
    if (!full) pasteCut = false;

    charCount.hidden = length < COUNT_FROM;
    charCount.classList.toggle('full', full);
    charCount.textContent = pasteCut
      ? `Cut off at ${input.maxLength.toLocaleString()}`
      : `${length.toLocaleString()} / ${input.maxLength.toLocaleString()}`;
    charCount.title = pasteCut
      ? 'The pasted text was longer than a message can be, and the end of it was dropped'
      : '';
  }

  input.addEventListener('paste', (e) => {
    const pasted = e.clipboardData?.getData('text') || '';
    const selected = input.selectionEnd - input.selectionStart;
    const room = input.maxLength - (input.value.length - selected);

    // The browser trims after this handler returns, so the check is made on
    // what is about to arrive. It is only a suspicion until then: a single
    // line box drops the line breaks in a paste, and text that fits once
    // they are gone leaves the box short of full, which clears the flag.
    pasteCut = pasted.length > room;
  });

  input.addEventListener('input', renderCharCount);
</script>

</body>
</html>
