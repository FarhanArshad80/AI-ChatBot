<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot || Realtime chat with modals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .shell {
      width: 640px;
      height: 90vh;
      background: #13131f;
      border-radius: 20px;
      border: 0.5px solid #2a2a3d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(83, 74, 183, 0.15);
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 0.5px solid #2a2a3d;
      background: #1a1a2e;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: #2d2560;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid #534AB7;
    }
    .avatar svg { width: 18px; height: 18px; }
    .header-title { font-size: 15px; font-weight: 600; color: #e0deff; }
    .header-sub { font-size: 12px; color: #7c7ca0; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #1D9E75;
      display: inline-block;
      box-shadow: 0 0 6px #1D9E75;
    }
    .reset-btn {
      font-size: 12px; font-weight: 500;
      background: transparent;
      border: 0.5px solid #3a3a5c;
      color: #7c7ca0;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reset-btn:hover { border-color: #534AB7; color: #c0b8ff; background: #1e1b3a; }

    /* MESSAGES */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a3d transparent;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #2a2a3d; border-radius: 4px; }

    .msg-row { display: flex; gap: 10px; align-items: flex-end; }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .msg-icon.bot { background: #2d2560; border: 1px solid #534AB7; }
    .msg-icon.user { background: #0f3d2e; border: 1px solid #1D9E75; }

    .bubble {
      max-width: 75%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
    }
    .bubble.bot {
      background: #1e1e32;
      color: #d0cfee;
      border: 0.5px solid #2a2a3d;
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: #2d2560;
      color: #e0deff;
      border: 0.5px solid #534AB7;
      border-bottom-right-radius: 4px;
    }
    .bubble.error {
      background: #2d1515;
      color: #f09595;
      border: 0.5px solid #5a2020;
    }
    .time { font-size: 11px; color: #4a4a6a; margin-top: 4px; }
    .time.right { text-align: right; }

    /* TYPING */
    .typing-indicator { display: flex; align-items: center; gap: 5px; padding: 14px 16px; }
    .typing-indicator span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #534AB7;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* CHIPS */
    .suggestions {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 4px 20px 12px;
    }
    .chip {
      font-size: 12px;
      padding: 6px 13px;
      border-radius: 20px;
      border: 0.5px solid #3a3a5c;
      background: #1a1a2e;
      color: #9090c0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { border-color: #534AB7; color: #c0b8ff; background: #1e1b3a; }

    /* INPUT */
    .input-area {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px;
      border-top: 0.5px solid #2a2a3d;
      background: #1a1a2e;
    }
    .input-wrap {
      flex: 1;
      display: flex; align-items: center;
      background: #13131f;
      border: 0.5px solid #3a3a5c;
      border-radius: 24px;
      padding: 0 16px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #534AB7; }
    .input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      color: #e0deff;
      padding: 11px 0;
      outline: none;
      font-family: 'Segoe UI', sans-serif;
    }
    .input-wrap input::placeholder { color: #4a4a6a; }

    .send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: #534AB7;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:hover { background: #3C3489; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #3a3a5a;
      padding: 6px 0 10px;
      background: #1a1a2e;
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.3"/>
          <path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="header-title">Gemini Assistant</div>
        <div class="header-sub"><span class="dot"></span> Online & ready</div>
      </div>
    </div>
    <button class="reset-btn" onclick="resetChat()">Clear chat</button>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="chat-box">
    <div class="msg-row">
      <div class="msg-icon bot">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/>
          <path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="bubble bot">Hi! I'm your Gemini assistant. Ask me anything — I'm here to help.</div>
        <div class="time" id="init-time"></div>
      </div>
    </div>
  </div>

  <!-- SUGGESTION CHIPS -->
  <div class="suggestions" id="suggestions">
    <span class="chip" onclick="useChip(this)">What can you do?</span>
    <span class="chip" onclick="useChip(this)">Tell me a fun fact</span>
    <span class="chip" onclick="useChip(this)">Help me write something</span>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-wrap">
      <input id="user-input" type="text" placeholder="Type your message..." />
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="footer-note">Powered by Gemini · Responses may be inaccurate</div>
</div>

<script>
  const chatBox = document.getElementById('chat-box');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  document.getElementById('init-time').textContent = now();

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function escHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function appendMsg(text, type) {
    const isUser = type === 'user';
    const row = document.createElement('div');
    row.className = 'msg-row' + (isUser ? ' user' : '');

    const botIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/><path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/></svg>`;
    const userIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#1D9E75" opacity="0.4"/><path d="M12 7a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-5 10c0-2.2 2.2-4 5-4s5 1.8 5 4" stroke="#9FE1CB" stroke-width="2" stroke-linecap="round"/></svg>`;

    const bubbleClass = type === 'error' ? 'bubble error' : (isUser ? 'bubble user' : 'bubble bot');

    row.innerHTML = `
      <div class="msg-icon ${isUser ? 'user' : 'bot'}">${isUser ? userIcon : botIcon}</div>
      <div>
        <div class="${bubbleClass}">${escHtml(text)}</div>
        <div class="time ${isUser ? 'right' : ''}">${now()}</div>
      </div>`;

    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.id = 'typing-row';
    const botIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/><path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/></svg>`;
    row.innerHTML = `
      <div class="msg-icon bot">${botIcon}</div>
      <div class="bubble bot" style="padding:0">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>`;
    chatBox.appendChild(row);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function useChip(el) {
    input.value = el.textContent;
    document.getElementById('suggestions').style.display = 'none';
    sendMessage();
  }

  async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    document.getElementById('suggestions').style.display = 'none';
    appendMsg(msg, 'user');
    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('http://localhost:5000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      removeTyping();
      if (data.error) appendMsg('Error: ' + data.error, 'error');
      else appendMsg(data.reply, 'bot');
    } catch (e) {
      removeTyping();
      appendMsg('Could not reach the backend. Is your Flask server running?', 'error');
    }

    sendBtn.disabled = false;
    input.focus();
  }

  async function resetChat() {
    try { await fetch('http://localhost:5000/reset', { method: 'POST' }); } catch(e) {}
    chatBox.innerHTML = '';
    const botIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#534AB7" opacity="0.4"/><path d="M8 12h8M12 8v8" stroke="#c0b8ff" stroke-width="2" stroke-linecap="round"/></svg>`;
    chatBox.innerHTML = `
      <div class="msg-row">
        <div class="msg-icon bot">${botIcon}</div>
        <div>
          <div class="bubble bot">Chat cleared. Fresh start!</div>
          <div class="time">${now()}</div>
        </div>
      </div>`;
    document.getElementById('suggestions').style.display = 'flex';
  }

  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
